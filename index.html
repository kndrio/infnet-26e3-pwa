<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="manifest" href="app.webmanifest" />
    <title>Nosso Primeiro PWA</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Nosso Primeiro WPA!</h1>
      <p id="status">Verificando suporte...</p>
      <button id="installButton" class="btn-install" hidden>Instalar WPA </button>
    </header>
    <div id="offlineBanner" class="offline-banner" hidden>
      Você está offline. Suas notas continuam sendo salvas localmente e serão sincronizadas quando a conexão voltar.
    </div>
    <p id="syncBadge" class="sync-badge" hidden></p>
    <main>
      <form id="noteForm" class="note-form">
        <input
          id="noteTitle"
          type="text"
          placeholder="Título da nota"
          required
          name="title"
        />
        <textarea
          id="noteContent"
          placeholder="Conteúdo (opcional)"
          rows="2"
          name="content"
        ></textarea>
        <button type="submit">Salvar nota</button>
      </form>
      <ul id="notesList" class="notes-list"></ul>
    </main>
    <!-- Notificações -->
    <div id="notification-actions" class="notification-actions">
      <button type="button" id="enableNotificationsButton">Ativar notificações</button>
      <p id="notificationStatus" class="status"></p>
    </div>

    <!-- Debug Install/Cache SW -->
    <div id="debug-action">
      <button id="checkVersionButton">Ver versão do cache (SW)</button>
      <button id="clearCacheButton">Limpar cache de runtime</button>
    </div>

    <!--Biblioteca Dexie - wrapper para IndexedDB-->
    <script src="cdn/dexie.js"></script>
    <script src="db.js"></script>
    <!--script src="db-nativo.js"></script-->
    <script src="app.js"></script>
  </body>
</html>
